<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匿名掲示板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <span class="site-logo" id="siteLogo">掲示板</span>
      <div class="header-actions">
        <button class="btn-profile" id="btnProfile" title="プロフィール設定">🐱</button>
        <button class="btn-new" id="btnNew">スレを立てる</button>
      </div>
    </div>
  </header>

  <!-- 下書き一覧モーダル -->
  <div class="modal-overlay hidden" id="draftModal">
    <div class="modal draft-modal">
      <p class="modal-title">下書き一覧</p>
      <div id="draftList" class="draft-list"></div>
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn-cancel" id="closeDraftModal">閉じる</button>
      </div>
    </div>
  </div>

  <!-- プロフィール設定モーダル -->
  <div class="modal-overlay hidden" id="profileModal">
    <div class="modal">
      <p class="modal-title">プロフィール設定</p>
      <label class="profile-label">名前</label>
      <input type="text" id="profileNameInput" placeholder="名無し" maxlength="30">
      <label class="profile-label">アイコン</label>
      <div class="icon-grid" id="iconGrid"></div>
      <div class="modal-actions" style="margin-top:20px">
        <button class="btn-primary" id="saveProfile">保存</button>
        <button class="btn-cancel" id="cancelProfile">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- スレ立てモーダル -->
  <div class="modal-overlay hidden" id="modal">
    <div class="modal">
      <p class="modal-title">スレを立てる</p>
      <input type="text" id="threadTitleInput" placeholder="タイトルを入力..." maxlength="100">
      <div class="modal-actions">
        <button class="btn-primary" id="submitThread">立てる</button>
        <button class="btn-cancel" id="cancelThread">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- スレッド一覧 -->
  <div id="boardView">
    <div class="container">
      <div id="threadList" class="thread-list"></div>
      <div id="boardEmpty" class="empty hidden">まだスレッドがありません</div>
    </div>
  </div>

  <!-- スレッド内ビュー -->
  <div id="threadView" class="hidden">
    <div class="thread-top">
      <div class="container">
        <button class="btn-back" id="btnBack">← スレッド</button>
        <h2 id="threadTitle"></h2>
      </div>
    </div>
    <div class="container">
      <div id="postList" class="post-list"></div>
      <div id="threadEmpty" class="empty hidden">最初の書き込みをどうぞ！</div>
    </div>
    <div class="post-form-wrap">
      <div class="container">
        <div class="post-form">
          <div class="post-form-row">
            <div class="post-my-avatar" id="postMyAvatar">🐱</div>
            <textarea id="postContent" placeholder="書き込む..." maxlength="1000" rows="2"></textarea>
            <button class="btn-primary" id="submitPost">投稿</button>
          </div>
          <div class="draft-actions">
            <button class="btn-draft-save" id="btnDraftSave">下書き保存</button>
            <button class="btn-draft-list" id="btnDraftList">下書き一覧 <span id="draftCount">0</span>件</button>
            <span class="auto-save-label" id="autoSaveLabel"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
